<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="app"></main>
    <button onclick="filtro('https://api.spacexdata.com/v4/crew/:id')">ID</button>
    <button onclick="filtro('https://api.spacexdata.com/v4/crew/:status')">Estado</button>

    <script>
        let pokemones = [];
        let totalPokes = 1026; /* debe agregarse uno mas ya q el indice comienza en 0 */

        async function  conexionLista() {
            const res = await fetch('https://api.spacexdata.com/v4/crew')
            const data = await res.json()
            pokemones = data;
            //mostrarLista(pokemones)
            console.log(data.length)

            for (var i=0; i < data.length; i++){
                console.log(pokemones[i].name)
                document.getElementById("app").innerHTML += "<p>" + [i] + " " + pokemones[i].name + " " + pokemones[i].agency + "</p>"
            }
}
async function  filtro(unTipo) {
    try{
            const respuesta = await fetch(unTipo);
            const datos = await respuesta.json();

            const pokemonesFiltrados = datos;
            console.log(pokemonesFiltrados)
    }catch (error){
        console.error("Error al filtrar por tipo:", error);
            document.getElementById("app").innerHTML = `<p>Error al cargar Pokémon de tipo "${untipo}".</p>`;
    </script>
    
</body>
</html>
